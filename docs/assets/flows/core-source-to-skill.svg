<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Praxis Core source to skill workflow</title>
  <desc id="desc">A node workflow showing Praxis Core capturing a source, archiving evidence, branching into chunking and SkillGraph memory, then supporting search, skills, and agent work.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a2a2a"/>
    </marker>
    <style>
      .box { fill: #f0edff; stroke: #8b6cff; stroke-width: 1.8; rx: 0; }
      .text { font: 600 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2b2b33; text-anchor: middle; dominant-baseline: middle; }
      .arrow { fill: none; stroke: #2a2a2a; stroke-width: 1.7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="330" fill="#ffffff"/>

  <g transform="translate(55 135)">
    <rect class="box" width="160" height="58"/>
    <text class="text" x="80" y="29">Capture Source</text>
  </g>

  <g transform="translate(265 135)">
    <rect class="box" width="170" height="58"/>
    <text class="text" x="85" y="29">Archive Evidence</text>
  </g>

  <g transform="translate(555 62)">
    <rect class="box" width="160" height="58"/>
    <text class="text" x="80" y="29">Chunk + Embed</text>
  </g>

  <g transform="translate(468 210)">
    <rect class="box" width="205" height="58"/>
    <text class="text" x="102.5" y="29">SkillGraph Proposal</text>
  </g>

  <g transform="translate(735 210)">
    <rect class="box" width="190" height="58"/>
    <text class="text" x="95" y="29">Provisional Memory</text>
  </g>

  <g transform="translate(815 62)">
    <rect class="box" width="170" height="58"/>
    <text class="text" x="85" y="29">Hybrid Search</text>
  </g>

  <g transform="translate(1000 62)">
    <rect class="box" width="145" height="58"/>
    <text class="text" x="72.5" y="29">Agent Work</text>
  </g>

  <g transform="translate(980 210)">
    <rect class="box" width="145" height="58"/>
    <text class="text" x="72.5" y="29">Skill Export</text>
  </g>

  <path class="arrow" d="M 215 164 H 260"/>
  <path class="arrow" d="M 435 164 H 490 V 91 H 550"/>
  <path class="arrow" d="M 435 164 H 455 V 239 H 463"/>
  <path class="arrow" d="M 673 239 H 730"/>
  <path class="arrow" d="M 715 91 H 810"/>
  <path class="arrow" d="M 925 239 H 975"/>
  <path class="arrow" d="M 925 239 H 955 V 125 H 900"/>
  <path class="arrow" d="M 985 91 H 995"/>
  <path class="arrow" d="M 1052 210 V 125"/>
</svg>
