<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Praxis Reach for Agencies client capsule to workflow</title>
  <desc id="desc">A node workflow showing a client capsule branching into systems, field maps, metrics, and permissions, then merging into Reach queries, evidence, context packs, and reusable agency workflows.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a2a2a"/>
    </marker>
    <style>
      .box { fill: #f0edff; stroke: #8b6cff; stroke-width: 1.8; rx: 0; }
      .text { font: 600 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2b2b33; text-anchor: middle; dominant-baseline: middle; }
      .small { font-size: 16px; }
      .arrow { fill: none; stroke: #2a2a2a; stroke-width: 1.7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="360" fill="#ffffff"/>

  <g transform="translate(45 151)">
    <rect class="box" width="165" height="58"/>
    <text class="text" x="82.5" y="23">Client</text>
    <text class="text" x="82.5" y="43">Capsule</text>
  </g>

  <g transform="translate(275 58)">
    <rect class="box" width="155" height="58"/>
    <text class="text" x="77.5" y="29">Systems</text>
  </g>

  <g transform="translate(275 151)">
    <rect class="box" width="155" height="58"/>
    <text class="text" x="77.5" y="29">Field Maps</text>
  </g>

  <g transform="translate(275 244)">
    <rect class="box" width="155" height="58"/>
    <text class="text" x="77.5" y="23">Metrics +</text>
    <text class="text" x="77.5" y="43">Permissions</text>
  </g>

  <g transform="translate(515 151)">
    <rect class="box" width="145" height="58"/>
    <text class="text" x="72.5" y="23">Reach</text>
    <text class="text" x="72.5" y="43">Query</text>
  </g>

  <g transform="translate(725 151)">
    <rect class="box" width="155" height="58"/>
    <text class="text" x="77.5" y="23">Client</text>
    <text class="text" x="77.5" y="43">Evidence</text>
  </g>

  <g transform="translate(945 151)">
    <rect class="box" width="155" height="58"/>
    <text class="text" x="77.5" y="23">Client</text>
    <text class="text" x="77.5" y="43">Context Pack</text>
  </g>

  <g transform="translate(945 257)">
    <rect class="box" width="155" height="58"/>
    <text class="text small" x="77.5" y="23">Reusable Agency</text>
    <text class="text small" x="77.5" y="43">Workflow</text>
  </g>

  <path class="arrow" d="M 210 180 H 240 V 87 H 270"/>
  <path class="arrow" d="M 210 180 H 270"/>
  <path class="arrow" d="M 210 180 H 240 V 273 H 270"/>
  <path class="arrow" d="M 430 87 H 470 V 169 H 510"/>
  <path class="arrow" d="M 430 180 H 510"/>
  <path class="arrow" d="M 430 273 H 470 V 191 H 510"/>
  <path class="arrow" d="M 660 180 H 720"/>
  <path class="arrow" d="M 880 180 H 940"/>
  <path class="arrow" d="M 1022 209 V 252"/>
</svg>
