<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Praxis Reach live system to context pack workflow</title>
  <desc id="desc">A node workflow showing Praxis Reach reading from a source system, recording a query manifest, creating evidence, checking freshness and conflicts, and producing context for agent work.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a2a2a"/>
    </marker>
    <style>
      .box { fill: #f0edff; stroke: #8b6cff; stroke-width: 1.8; rx: 0; }
      .text { font: 600 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2b2b33; text-anchor: middle; dominant-baseline: middle; }
      .small { font-size: 16px; }
      .arrow { fill: none; stroke: #2a2a2a; stroke-width: 1.7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="330" fill="#ffffff"/>

  <g transform="translate(45 135)">
    <rect class="box" width="155" height="58"/>
    <text class="text" x="77.5" y="29">Source System</text>
  </g>

  <g transform="translate(245 135)">
    <rect class="box" width="175" height="58"/>
    <text class="text" x="87.5" y="23">Read-only</text>
    <text class="text" x="87.5" y="43">Connector</text>
  </g>

  <g transform="translate(465 135)">
    <rect class="box" width="165" height="58"/>
    <text class="text" x="82.5" y="29">Query Manifest</text>
  </g>

  <g transform="translate(675 135)">
    <rect class="box" width="150" height="58"/>
    <text class="text" x="75" y="29">Evidence Card</text>
  </g>

  <g transform="translate(875 65)">
    <rect class="box" width="160" height="58"/>
    <text class="text" x="80" y="29">Freshness Check</text>
  </g>

  <g transform="translate(875 205)">
    <rect class="box" width="160" height="58"/>
    <text class="text" x="80" y="23">Conflict</text>
    <text class="text" x="80" y="43">Warnings</text>
  </g>

  <g transform="translate(1080 135)">
    <rect class="box" width="90" height="58"/>
    <text class="text small" x="45" y="23">Context</text>
    <text class="text small" x="45" y="43">Pack</text>
  </g>

  <g transform="translate(1080 245)">
    <rect class="box" width="90" height="58"/>
    <text class="text small" x="45" y="23">Agent</text>
    <text class="text small" x="45" y="43">Work</text>
  </g>

  <path class="arrow" d="M 200 164 H 240"/>
  <path class="arrow" d="M 420 164 H 460"/>
  <path class="arrow" d="M 630 164 H 670"/>
  <path class="arrow" d="M 825 164 H 850 V 94 H 870"/>
  <path class="arrow" d="M 825 164 H 850 V 234 H 870"/>
  <path class="arrow" d="M 1035 94 H 1060 V 151 H 1075"/>
  <path class="arrow" d="M 1035 234 H 1060 V 177 H 1075"/>
  <path class="arrow" d="M 1125 193 V 240"/>
</svg>
