<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="800" viewBox="0 0 1650 800" role="img" aria-labelledby="title desc">
  <title id="title">Praxis context-priority flow</title>
  <desc id="desc">A flowchart showing how Praxis turns documents, structured data, audio, video, images, live evidence, and user queries into explained agent context with provenance, trust, freshness, conflicts, and change history.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#30313a"/>
    </marker>
    <style>
      .canvas { fill: #ffffff; }
      .stage { font: 700 16px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6a6d7a; text-anchor: middle; }
      .box { stroke-width: 2; rx: 8; }
      .source { fill: #f6f2ff; stroke: #8b6cff; }
      .media { fill: #fdf4ff; stroke: #c026d3; }
      .intake { fill: #f0f9ff; stroke: #0ea5e9; }
      .live { fill: #ecfdf5; stroke: #10b981; }
      .query { fill: #f8fafc; stroke: #64748b; }
      .rank { fill: #fff7ed; stroke: #f59e0b; }
      .result { fill: #eff6ff; stroke: #2563eb; }
      .title { font: 700 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #262833; text-anchor: middle; }
      .body { font: 500 14px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4b4d59; text-anchor: middle; }
      .arrow { fill: none; stroke: #30313a; stroke-width: 2; marker-end: url(#arrow); }
      .merge { fill: none; stroke: #7a7d89; stroke-width: 1.7; stroke-dasharray: 5 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="canvas" width="1650" height="800"/>

  <text class="stage" x="185" y="42">Inputs</text>
  <text class="stage" x="525" y="42">Intake</text>
  <text class="stage" x="855" y="42">Capture</text>
  <text class="stage" x="1165" y="42">Evidence + Indexes</text>
  <text class="stage" x="1485" y="42">Agent Context</text>

  <g transform="translate(55 78)">
    <rect class="box source" width="260" height="92" rx="8"/>
    <text class="title" x="130" y="32">Source Material</text>
    <text class="body" x="130" y="58">docs, PDFs, notes</text>
    <text class="body" x="130" y="76">web pages</text>
  </g>

  <g transform="translate(55 210)">
    <rect class="box source" width="260" height="92" rx="8"/>
    <text class="title" x="130" y="32">Data Sources</text>
    <text class="body" x="130" y="58">CSVs, tables, surveys</text>
    <text class="body" x="130" y="76">exports</text>
  </g>

  <g transform="translate(55 342)">
    <rect class="box media" width="260" height="112" rx="8"/>
    <text class="title" x="130" y="32">Audio + Visual</text>
    <text class="body" x="130" y="58">audio, video</text>
    <text class="body" x="130" y="76">images, screenshots</text>
    <text class="body" x="130" y="94">transcripts, OCR</text>
  </g>

  <g transform="translate(55 520)">
    <rect class="box live" width="260" height="92" rx="8"/>
    <text class="title" x="130" y="32">Live GTM Systems</text>
    <text class="body" x="130" y="58">CRM, ads, analytics</text>
    <text class="body" x="130" y="76">revenue systems</text>
  </g>

  <g transform="translate(390 170)">
    <rect class="box intake" width="270" height="160" rx="8"/>
    <text class="title" x="135" y="32">Intake + Conversion</text>
    <text class="body" x="135" y="62">parsers + OCR</text>
    <text class="body" x="135" y="84">transcripts + diarization</text>
    <text class="body" x="135" y="106">keyframes + visual signals</text>
    <text class="body" x="135" y="128">parse quality</text>
  </g>

  <g transform="translate(390 520)">
    <rect class="box live" width="270" height="92" rx="8"/>
    <text class="title" x="135" y="32">Evidence Cards</text>
    <text class="body" x="135" y="58">source links, freshness</text>
    <text class="body" x="135" y="76">warnings</text>
  </g>

  <g transform="translate(720 150)">
    <rect class="box source" width="270" height="96" rx="8"/>
    <text class="title" x="135" y="34">Capture + Registry</text>
    <text class="body" x="135" y="62">source_id, capture_id</text>
    <text class="body" x="135" y="80">hashes</text>
  </g>

  <g transform="translate(720 315)">
    <rect class="box source" width="270" height="112" rx="8"/>
    <text class="title" x="135" y="32">Evidence Archive</text>
    <text class="body" x="135" y="58">raw text + summaries</text>
    <text class="body" x="135" y="76">media metadata</text>
    <text class="body" x="135" y="94">source manifests</text>
  </g>

  <g transform="translate(720 585)">
    <rect class="box query" width="270" height="92" rx="8"/>
    <text class="title" x="135" y="32">User Or Agent Query</text>
    <text class="body" x="135" y="58">question, task</text>
    <text class="body" x="135" y="76">workflow need</text>
  </g>

  <g transform="translate(1030 215)">
    <rect class="box source" width="270" height="92" rx="8"/>
    <text class="title" x="135" y="32">SkillGraph Changes</text>
    <text class="body" x="135" y="58">audit, conflicts</text>
    <text class="body" x="135" y="76">rollback</text>
  </g>

  <g transform="translate(1030 390)">
    <rect class="box source" width="270" height="92" rx="8"/>
    <text class="title" x="135" y="32">Chunks + Embeddings</text>
    <text class="body" x="135" y="58">semantic + keyword</text>
    <text class="body" x="135" y="76">indexes</text>
  </g>

  <g transform="translate(1360 205)">
    <rect class="box rank" width="250" height="150" rx="8"/>
    <text class="title" x="125" y="34">Context Priority</text>
    <text class="body" x="125" y="64">semantic + keyword</text>
    <text class="body" x="125" y="86">graph + entity</text>
    <text class="body" x="125" y="108">trust + freshness</text>
    <text class="body" x="125" y="130">conflicts</text>
  </g>

  <g transform="translate(1360 420)">
    <rect class="box result" width="250" height="96" rx="8"/>
    <text class="title" x="125" y="34">Explained Result</text>
    <text class="body" x="125" y="64">priority_breakdown</text>
    <text class="body" x="125" y="82">source_id + capture_id</text>
  </g>

  <g transform="translate(1360 610)">
    <rect class="box result" width="250" height="82" rx="8"/>
    <text class="title" x="125" y="32">Agent-Ready Context</text>
    <text class="body" x="125" y="58">answer, reference, workflow</text>
  </g>

  <path class="arrow" d="M 315 124 H 360 V 230 H 385"/>
  <path class="arrow" d="M 315 256 H 385"/>
  <path class="arrow" d="M 315 398 H 360 V 294 H 385"/>
  <path class="arrow" d="M 660 250 H 690 V 198 H 715"/>
  <path class="arrow" d="M 855 246 V 310"/>
  <path class="arrow" d="M 315 566 H 385"/>
  <path class="arrow" d="M 660 566 H 1325 V 318 H 1355"/>
  <path class="arrow" d="M 990 358 H 1015 V 261 H 1025"/>
  <path class="arrow" d="M 990 395 H 1025"/>
  <path class="merge" d="M 1300 261 H 1355"/>
  <path class="merge" d="M 1300 436 H 1325 V 318 H 1355"/>
  <path class="arrow" d="M 990 631 H 1325 V 318 H 1355"/>
  <path class="arrow" d="M 1485 355 V 415"/>
  <path class="arrow" d="M 1485 516 V 605"/>
</svg>
