name: Good first issue
description: Suggest a small, well-scoped contribution.
title: "[Good first issue]: "
labels:
  - good first issue
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What should be changed?
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Likely files or commands
      description: Point contributors to the likely starting place.
  - type: textarea
    id: done
    attributes:
      label: Definition of done
      description: How will we know this is complete?
    validations:
      required: true
