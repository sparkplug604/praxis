[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "praxis-ktos"
version = "0.3.0"
description = "Local-first RAG and agent skills framework for source-traceable agent memory."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Praxis contributors" }
]
keywords = [
  "ai-agents",
  "agent-memory",
  "agent-skills",
  "rag",
  "retrieval-augmented-generation",
  "knowledge-graph",
  "semantic-search",
  "hybrid-search",
  "context-engineering",
  "llm",
  "llmops",
  "agentic-ai",
  "ai-workflows",
  "local-first",
  "sqlite",
  "skillgraph",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
intake-basic = [
  "pypdf",
]
intake-ocr = [
  "pillow",
  "pytesseract",
]
intake-office = [
  "markitdown",
]
intake-stt = [
  "faster-whisper",
]
intake-scenes = [
  "scenedetect",
]
intake-diarization = [
  "pyannote.audio",
]
intake-visual = [
  "open_clip_torch",
  "torch",
]
intake-media = [
  "faster-whisper",
  "pillow",
  "pytesseract",
]
intake-full-media = [
  "faster-whisper",
  "pillow",
  "pytesseract",
  "scenedetect",
  "pyannote.audio",
  "open_clip_torch",
  "torch",
]
reach = []
agency = []
hubspot = []
google-ads = [
  "google-ads",
]
google-analytics = [
  "google-analytics-data",
  "google-analytics-admin",
]
bigquery = [
  "google-cloud-bigquery",
]
meta-ads = []
all = [
  "pypdf",
  "markitdown",
  "faster-whisper",
  "google-ads",
  "google-analytics-data",
  "google-analytics-admin",
  "google-cloud-bigquery",
]

[project.urls]
Homepage = "https://github.com/sparkplug604/praxis"
Repository = "https://github.com/sparkplug604/praxis"
Issues = "https://github.com/sparkplug604/praxis/issues"
Documentation = "https://github.com/sparkplug604/praxis#readme"

[project.scripts]
praxis = "praxis.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
praxis = [
  "demo_data/stackoverflow_developer_survey/*",
  "relationship_evidence/*.json",
]

[tool.setuptools.packages.find]
where = ["src"]
